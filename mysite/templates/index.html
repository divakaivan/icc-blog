{% extends "base.html" %}
{% load static %}
{% block content %}
<style>

    body {
        font-family: "Roboto", sans-serif;
        font-size: 18px;
        background-color: #fdfdfd;
    }

    .head_text {
        color: white;
    }

    #header-image {
        max-width: 100%;
        width: 100%;
        height: 350px;
    }

    .card {
        box-shadow: 0 16px 48px #E3E7EB;
    }
    .slide-in-bck-left{
        animation:slide-in-bck-left 2s cubic-bezier(.25,.46,.45,.94) 2s both;
    }

    #code-block {

    }


       /* ----------------------------------------------
    * Generated by Animista on 2020-1-3 15:14:18
    * Licensed under FreeBSD License.
    * See http://animista.net/license for more info.
    * w: http://animista.net, t: @cssanimista
    * ---------------------------------------------- */

    @keyframes slide-in-bck-left{0%{transform:translateZ(700px) translateX(-400px);opacity:0}100%{transform:translateZ(0) translateX(0);opacity:1}}
</style>


<div class="container">
    <div class="jumbotron-fluid">
    <div class="row">
        <div class="col-md-2 sm-0"></div>
        <div id="no-padding" class="col-md-4 sm-12">
            <!--TODO: figure out how to properly add static files with Django-->
            <img class="img-fluid" src="https://github.com/divakaivan/icc-blog/blob/master/mysite/static/mysite/code-pc-welcome.png?raw=true"/>
        </div>
        <div class="col-md-4 sm-12">
            <h1 class="slide-in-bck-left">HELLO</h1>
        </div>
        <div class="col-md-2 sm-0"></div>
    </div>
</div>
    <div class="row">
        <div class="col-md-8 mt-3 left">
            {% for post in post_list %}
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title">{{ post.title }}</h2>
                    <p class="card-text text-muted h6">{{ post.author }} | {{ post.created_on}} </p>
                    <p class="card-text">{{post.summary}}</p>
                    <a href="{% url 'post_detail' post.slug  %}" class="btn btn-primary">Read More &rarr;</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% block sidebar %} {% include 'sidebar.html' %} {% endblock sidebar %}
    </div>
</div>
{%endblock%}
